<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Conecta Bairro{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <h1>Conecta Bairro</h1>
    <p>Gestão simples para pequenos comércios</p>

    <button
        id="botao-contraste"
        class="botao-acessibilidade"
        type="button"
        aria-pressed="false"
        onclick="alternarContraste()">
        ◐ Alto contraste
    </button>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>Conecta Bairro — MVP Acadêmico</p>
</footer>

<script>
    function alternarContraste() {
        const corpo = document.body;
        const botao = document.getElementById("botao-contraste");

        corpo.classList.toggle("alto-contraste");

        const ativo = corpo.classList.contains("alto-contraste");

        botao.setAttribute("aria-pressed", ativo);

        if (ativo) {
            botao.textContent = "◐ Desativar alto contraste";
        } else {
            botao.textContent = "◐ Alto contraste";
        }
    }
</script>

</body>
</html>
